# Local SeaweedFS S3 store for running Apexion natively (`make run`, or
# ./bin/apexion serve). Start it with `make seaweed`, which also seeds the sample
# datasets into the "warehouse" bucket.
#
# S3 API: http://localhost:8333  ·  access key: admin  ·  secret: password
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: apexion-seaweedfs
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # S3 API (master/volume/filer ports stay inside the container)
    volumes:
      - seaweedfs-data:/data
      - ./configs/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  seaweedfs-data:
