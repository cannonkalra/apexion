services:
  minio:
    image: minio/minio:latest
    container_name: apexion-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: waits for MinIO, then uploads the sample datasets.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: apexion:latest
    container_name: apexion-seed
    depends_on:
      minio:
        condition: service_healthy
    environment:
      APEXION_MINIO_ENDPOINT: minio:9000
      APEXION_MINIO_ACCESS_KEY: minioadmin
      APEXION_MINIO_SECRET_KEY: minioadmin
    entrypoint: ["seed"]
    restart: "no"

  apexion:
    build:
      context: .
      dockerfile: Dockerfile
    image: apexion:latest
    container_name: apexion
    depends_on:
      minio:
        condition: service_healthy
    environment:
      APEXION_SERVER_HOST: 0.0.0.0
      APEXION_SERVER_PORT: 8080
      APEXION_MINIO_ENDPOINT: minio:9000
      APEXION_MINIO_ACCESS_KEY: minioadmin
      APEXION_MINIO_SECRET_KEY: minioadmin
      APEXION_STORAGE_PATH: /app/data/apexion.duckdb
      APEXION_LOG_PRETTY: "true"
      # To enable a local LLM agent, point at Ollama:
      # APEXION_AGENTS_PROVIDER: ollama
      # APEXION_AGENTS_LLM_BASE_URL: http://host.docker.internal:11434/v1
      # APEXION_AGENTS_LLM_MODEL: llama3.1
    ports:
      - "8080:8080"
    volumes:
      - apexion-data:/app/data

volumes:
  minio-data:
  apexion-data:
