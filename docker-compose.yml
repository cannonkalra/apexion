# Full local stack: MinIO (S3-compatible store) + a one-shot seeder that uploads
# sample datasets + the Apexion server. Start it with `docker compose up --build`
# and open http://localhost:8080.
services:
  minio:
    image: minio/minio:latest
    container_name: apexion-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: waits for MinIO, then uploads the sample datasets to the
  # "warehouse" bucket so Apexion has something to discover.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: apexion:latest
    container_name: apexion-seed
    depends_on:
      minio:
        condition: service_healthy
    environment:
      APEXION_MINIO_ENDPOINT: minio:9000
      APEXION_MINIO_ACCESS_KEY: admin
      APEXION_MINIO_SECRET_KEY: password
    entrypoint: ["seed"]
    restart: "no"

  apexion:
    build:
      context: .
      dockerfile: Dockerfile
    image: apexion:latest
    container_name: apexion
    depends_on:
      minio:
        condition: service_healthy
    environment:
      APEXION_SERVER_HOST: 0.0.0.0
      APEXION_SERVER_PORT: 8080
      APEXION_MINIO_ENDPOINT: minio:9000
      APEXION_MINIO_ACCESS_KEY: admin
      APEXION_MINIO_SECRET_KEY: password
      APEXION_STORAGE_PATH: /app/data/apexion.duckdb
      APEXION_LOG_PRETTY: "true"
    ports:
      - "8080:8080"
    volumes:
      - apexion-data:/app/data

volumes:
  minio-data:
  apexion-data:
