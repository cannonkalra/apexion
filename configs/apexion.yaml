# Apexion configuration.
#
# Every value can be overridden with an APEXION_-prefixed environment variable,
# with dots replaced by underscores — e.g. APEXION_MINIO_ENDPOINT overrides
# minio.endpoint, APEXION_SERVER_PORT overrides server.port.
#
# All values below are the built-in defaults; the file is entirely optional.

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 15s

storage:
  # Embedded DuckDB catalog. Use ":memory:" for an ephemeral catalog.
  path: data/apexion.duckdb
  max_open_conns: 1

# Default object-store connection. S3-compatible: AWS S3, MinIO, Cloudflare R2,
# SeaweedFS, and anything speaking the S3 API. Additional connections can be
# added and switched at runtime from the Settings page.
minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  use_ssl: false
  region: us-east-1

crawler:
  workers: 8
  rate_limit: 0        # ops/sec, 0 = unlimited
  list_page_size: 1000
  sample_bytes: 262144 # bytes read per file for schema detection
  checkpoint_every: 500
  ignore_hidden: true
  timeout: 1h

catalog:
  # Generated partition columns for bare-directory datasets, e.g. "pt" + "" -> pt0, pt1.
  virtual_partition_prefix: pt
  virtual_partition_separator: ""
  discovery:
    # positional (bare dirs -> pt0/pt1/...), hive (only key=value dirs
    # partition), or auto.
    strategy: positional

log:
  level: info
  pretty: true
