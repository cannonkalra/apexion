# Apexion configuration.
#
# Every value can be overridden with an APEXION_-prefixed environment variable,
# with dots replaced by underscores — e.g. APEXION_MINIO_ENDPOINT overrides
# minio.endpoint, APEXION_SERVER_PORT overrides server.port.
#
# All values below are the built-in defaults; the file is entirely optional.

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 15s

storage:
  # Embedded DuckDB catalog. Use ":memory:" for an ephemeral catalog.
  path: data/apexion.duckdb
  max_open_conns: 1

# Optional object-store credentials for headless / CLI runs (and the fallback
# store used before any connection is active). These are NOT a persisted
# connection: Apexion starts with zero configured connections, and you create
# your first one from the Settings page. On EC2 (or any host with an attached
# IAM role) leave access_key/secret_key blank to use the AWS credential chain.
# S3-compatible: AWS S3, MinIO, Cloudflare R2, SeaweedFS, and anything speaking
# the S3 API.
minio:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  use_ssl: false
  region: us-east-1

crawler:
  workers: 8
  rate_limit: 0        # ops/sec, 0 = unlimited
  list_page_size: 1000
  sample_bytes: 262144 # bytes read per file for schema detection
  checkpoint_every: 500
  ignore_hidden: true
  timeout: 1h

catalog:
  # Generated partition columns for bare-directory datasets, e.g. "pt" + "" -> pt0, pt1.
  virtual_partition_prefix: pt
  virtual_partition_separator: ""
  discovery:
    # positional (bare dirs -> pt0/pt1/...), hive (only key=value dirs
    # partition), or auto.
    strategy: positional

# DuckLake catalog. Registered tables are stored as views in a DuckLake, so they
# persist across restarts and any DuckDB client can query them with
#   ATTACH 'ducklake:data/apexion.ducklake' AS lake;
# Views read the original files in place — DuckLake never takes ownership of
# your data files.
ducklake:
  enabled: true
  # Metadata location. Empty derives it from storage.path (data/apexion.ducklake).
  # Use "postgres:dbname=lake host=…" to share one lake between machines.
  metadata: ""
  # Where DuckLake writes table data, e.g. s3://bucket/lake/. Fixed when the lake
  # is first created; empty uses <metadata>.files/.
  data_path: ""

log:
  level: info
  pretty: true
